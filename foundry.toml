[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "qore-pq-kit/=kit/src/",
  "qore-pq-kit-test/=kit/test/",
  # PealTenderV2 and its tests use qore-pq-kit by git tag (v0.3.0, installed into
  # lib/ by `npm run setup`). The drill vault keeps the in-repo kit/ copy until
  # after the Q-Day Drill; the Solidity sources are byte-identical.
  "pqkit/=lib/qore-pq-kit/src/",
  "pqkit-test/=lib/qore-pq-kit/test/",
]
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
qorechain_testnet = "https://evm-testnet.qore.host"

[lint]
lint_on_build = false
