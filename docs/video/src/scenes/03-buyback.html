<!-- {"id":"buyback","start":34.3,"dur":28.1} -->
<style>
  #s3-rail { position: absolute; left: 120px; top: 150px; width: 1680px; height: 90px; }
  #s3-railline { position: absolute; left: 22px; right: 22px; top: 21px; height: 2px; background: var(--rule); }
  #s3-railfill { position: absolute; left: 22px; top: 21px; height: 2px; width: 1636px; background: var(--accent); transform-origin: 0 0; }
  .s3-step { position: absolute; top: 0; color: var(--muted); }
  .s3-dot { width: 44px; height: 44px; border-radius: 22px; border: 2px solid var(--muted); background: var(--sheet); font-family: "IBM Plex Mono", monospace; font-size: 24px; line-height: 40px; text-align: center; }
  .s3-lab { margin-top: 12px; font-size: 28px; font-weight: 500; white-space: nowrap; }
  #s3-view { left: 0; top: 290px; width: 1920px; height: 770px; }
  #s3-hl-ladder { left: 150px; top: 338px; width: 470px; height: 36px; }
  #s3-hl-offers { left: 772px; top: 88px; width: 368px; height: 92px; }
  #s3-hl-chart { left: 4px; top: 30px; width: 640px; height: 350px; }
  #s3-hl-bar { left: 466px; top: 70px; width: 150px; height: 296px; }
  #s3-hl-clear { left: 772px; top: 180px; width: 368px; height: 46px; }
  #s3-hl-bought { left: 772px; top: 225px; width: 368px; height: 46px; }
</style>
<div class="stage" id="s3-stage">
  <div class="chap" id="s3-chap"><b>03</b> &nbsp;How a buyback clears</div>
  <img class="brandmark" id="s3-brand" src="assets/brand/lockup.svg" alt="Peal Tender" />
  <div id="s3-rail">
    <div id="s3-railline"></div>
    <div id="s3-railfill"></div>
    <div class="s3-step" id="s3-st1" style="left:0px"><div class="s3-dot">1</div><div class="s3-lab">Deposit</div></div>
    <div class="s3-step" id="s3-st2" style="left:398px"><div class="s3-dot">2</div><div class="s3-lab">Open a tender</div></div>
    <div class="s3-step" id="s3-st3" style="left:796px"><div class="s3-dot">3</div><div class="s3-lab">Offers</div></div>
    <div class="s3-step" id="s3-st4" style="left:1194px"><div class="s3-dot">4</div><div class="s3-lab">One clearing price</div></div>
    <div class="s3-step" id="s3-st5" style="left:1560px"><div class="s3-dot">5</div><div class="s3-lab">Settle</div></div>
  </div>
  <div class="view" id="s3-view">
    <div class="cam" id="s3-cam" style="width:1136px">
      <img src="assets/shots/buyback.png" width="1136" height="470" alt="Tender 1 of the drill vault: offers per price and the clearing price" />
      <div class="hl plain" id="s3-hl-ladder"></div>
      <div class="hl" id="s3-hl-offers"></div>
      <div class="hl" id="s3-hl-chart"></div>
      <div class="hl" id="s3-hl-bar"></div>
      <div class="hl" id="s3-hl-clear"></div>
      <div class="hl" id="s3-hl-bought"></div>
    </div>
  </div>
</div>
<script>
  const BOX = { x: 120, y: 10, w: 1680, h: 740 };
  inn("#s3-chap", 0.1);
  inn("#s3-brand", 0.1);
  inn("#s3-rail", 0.3);
  tl.set("#s3-railfill", { scaleX: 0 }, 0);
  camSet("#s3-cam", [0, 0, 1136, 470], BOX);
  inn("#s3-view", 0.8, { d: 0.5 });
  const step = (n, t, frac) => {
    tl.to("#s3-st" + n, { color: "#10231d", duration: 0.35, ease: "power2.out" }, t);
    tl.to("#s3-st" + n + " .s3-dot", { backgroundColor: "#1e5b46", borderColor: "#1e5b46", color: "#fcfdfc", duration: 0.35 }, t);
    if (frac) tl.to("#s3-railfill", { scaleX: frac, duration: 0.6, ease: "power2.inOut" }, t - 0.3);
  };
  // "The treasury deposits its payment token"
  step(1, 3.3);
  // "and opens a tender: a budget, and a ladder of prices"
  step(2, 5.0, 0.25);
  hlIn("#s3-hl-ladder", 6.8);
  hlOut("#s3-hl-ladder", 8.1);
  // "Holders offer their tokens at the lowest price they'll accept"
  step(3, 8.2, 0.5);
  hlIn("#s3-hl-offers", 8.4);
  hlOut("#s3-hl-offers", 11.2);
  // "The price climbs while the budget can still pay every offer at or below it"
  step(4, 11.5, 0.75);
  hlIn("#s3-hl-chart", 11.6);
  hlOut("#s3-hl-chart", 15.0);
  // "At settlement, everyone who sells is paid that one clearing price"
  step(5, 15.3, 1);
  camTo("#s3-cam", [0, 10, 660, 420], BOX, 15.3, 1.5);
  hlIn("#s3-hl-bar", 18.3);
  hlOut("#s3-hl-bar", 20.2);
  // "The vault's first tender cleared at 0.0013, and bought back 76.92 tokens"
  camTo("#s3-cam", [700, 30, 436, 340], BOX, 20.3, 1.5);
  hlIn("#s3-hl-clear", 22.2);
  hlOut("#s3-hl-clear", 24.3);
  hlIn("#s3-hl-bought", 24.4);
  endScene("#s3-stage");
</script>
