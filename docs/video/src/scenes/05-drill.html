<!-- {"id":"drill","start":90.0,"dur":16.0} -->
<style>
  #s5-title { position: absolute; left: 120px; top: 160px; }
  #s5-date { position: absolute; left: 120px; top: 252px; font-size: 26px; color: var(--ink-2); }
  #s5-acct { position: absolute; left: 120px; top: 340px; width: 560px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 26px 30px; }
  #s5-acct .label { font-size: 22px; }
  #s5-acct .addr { font-family: "IBM Plex Mono", monospace; font-size: 25px; margin: 8px 0 18px; word-break: break-all; line-height: 1.4; }
  #s5-acct .row { display: flex; justify-content: space-between; align-items: center; font-size: 25px; padding-top: 14px; border-top: 1px solid var(--rule); }
  #s5-lead { position: absolute; left: 120px; top: 600px; width: 560px; font-size: 27px; line-height: 1.45; color: var(--ink-2); }
  #s5-stamp { position: absolute; left: 150px; top: 790px; padding: 14px 28px; border: 4px solid var(--stamp); border-radius: 8px; color: var(--stamp); background: rgba(249, 235, 233, 0.85); text-align: center; }
  #s5-stamp .big { font-family: "IBM Plex Mono", monospace; font-size: 54px; font-weight: 500; letter-spacing: 0.08em; }
  #s5-stamp .small { font-family: "IBM Plex Mono", monospace; font-size: 25px; letter-spacing: 0.06em; }
  #s5-view { left: 740px; top: 150px; width: 1080px; height: 830px; }
  #s5-cover { position: absolute; left: 470px; top: 0; width: 680px; height: 476px; background: #f1f4f2; transform-origin: 50% 100%; }
</style>
<div class="stage" id="s5-stage">
  <div class="chap" id="s5-chap"><b>05</b> &nbsp;The Q-Day Drill</div>
  <img class="brandmark" id="s5-brand" src="assets/brand/lockup.svg" alt="Peal Tender" />
  <h1 class="title" id="s5-title" data-split>The Q-Day Drill</h1>
  <div id="s5-date" class="mono">18 November 2026 · 00:00 to 23:59 UTC</div>
  <div id="s5-acct">
    <div class="label">Drill account, the vault's signer</div>
    <div class="addr">0x1453faDA276086E39A87CA39C1CD1F754cbf56bF</div>
    <div class="row"><span>its classical key</span><span class="tag no">HANDED OVER</span></div>
  </div>
  <div id="s5-lead">The attacker holds the key and tries everything it can do alone.</div>
  <div id="s5-stamp"><div class="big">9 OF 9</div><div class="small">REFUSED · NOTHING MOVED</div></div>
  <div class="view" id="s5-view">
    <div class="cam" id="s5-cam" style="width:1136px">
      <img src="assets/shots/rejected.png" width="1136" height="475" alt="Instructions refused in the drill rehearsal" />
      <div id="s5-cover"></div>
    </div>
  </div>
</div>
<script>
  const BOX = { x: 0, y: 0, w: 1080, h: 830 };
  inn("#s5-chap", 0.1);
  inn("#s5-brand", 0.1);
  // "For the Q-Day Drill on November eighteenth"
  words("#s5-title", 0.45, 0.1);
  inn("#s5-date", 2.2);
  // "the signer's classical key goes to the organisers"
  inn("#s5-acct", 3.3, { y: 12 });
  inn("#s5-acct .tag", 4.6, { d: 0.3 });
  // "We rehearsed every route with that key alone"
  inn("#s5-lead", 6.3);
  camSet("#s5-cam", [480, 0, 656, 475], BOX);
  inn("#s5-view", 6.6, { d: 0.4 });
  // rows uncover as they are named: transfers, windows, approvals, a forged sweep
  const rows = [[8.6, 119], [9.2, 214], [9.75, 310], [10.15, 357], [11.1, 476]];
  rows.forEach(([t, y]) => tl.to("#s5-cover", { scaleY: (476 - y) / 476, duration: 0.45, ease: "power2.out" }, t));
  // "Nine of nine were refused. Nothing moved."
  tl.fromTo("#s5-stamp", { opacity: 0, scale: 1.25, rotation: -5 }, { opacity: 1, scale: 1, rotation: -5, duration: 0.32, ease: "power4.out" }, 12.55);
  endScene("#s5-stage");
</script>
